modLoader="javafml"
loaderVersion="[1,)"
license="Personal use only"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="RLCraft Legacy Worldgen"
description='''Ports the RLCraft 1.12.2 overworld generator (vanilla 1.12 terrain + Traverse + Defiled Lands biomes) to 1.21.1.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="dynamictrees"
type="required"
versionRange="[1.7,)"
ordering="NONE"
side="BOTH"

[[mods]]
modId="llibrary"
version="1.7.20"
displayName="LLibrary (1.12 port)"
description='''The parts of LLibrary 1.7.20 that Ice and Fire 1.7.1 uses.'''

[[mods]]
modId="iceandfire"
version="1.7.1"
displayName="Ice and Fire (1.12 RLCraft port)"
description='''Ice and Fire 1.7.1 as in RLCraft 2.9.3, ported from the 1.12 code.'''

[[dependencies.iceandfire]]
modId="llibrary"
type="required"
versionRange="[1.7,)"
ordering="AFTER"
side="BOTH"

[[mods]]
modId="lycanitesmobs"
version="2.0.8.9"
displayName="Lycanites Mobs (1.12 RLCraft port)"
description='''Lycanites Mobs 2.0.8.9 as in RLCraft 2.9.3, ported from the 1.12 code with RLCraft's config.'''

[[mods]]
modId="simpledifficulty"
version="0.3.9"
displayName="SimpleDifficulty (1.12 RLCraft port)"
description='''Simple Difficulty 0.3.9 (thirst and temperature) as in RLCraft 2.9.3, ported from the 1.12 code.'''

[[mods]]
modId="firstaid"
version="1.6.22"
displayName="First Aid (1.12 RLCraft port)"
description='''First Aid 1.6.22 (body part health) as in RLCraft 2.9.3, ported from the 1.12 code.'''

[[mods]]
modId="notreepunching"
version="2.0.21"
displayName="No Tree Punching (1.12 RLCraft port)"
description='''No Tree Punching 2.0.21 as in RLCraft 2.9.3, ported from the 1.12 code.'''

[[mixins]]
config="iceandfire.mixins.json"

[[mixins]]
config="firstaid.mixins.json"
